{% extends "base.html" %}
{% block title %}新建{% endblock %}
{% block body %}

<h2>新建拍立得</h2>

<form method="post" class="form-new">

  <div class="field">
    <label>标识（id：shot_date + 首个 char + 6 位十六进制后缀）</label>
    <input name="pid" type="text" required value="{{ default_pid }}"
           pattern="[a-z0-9_\-]+" title="只允许小写字母数字下划线连字符">
    <small class="hint">根据下面的拍摄日期与首个角色自动派生；已存在的 id 不会自动重算</small>
  </div>

  <div class="field">
    <label>拍摄日期（shot_date）</label>
    <input id="new_shot_date" name="shot_date" type="text" value="{{ default_shot_date }}" placeholder="YYYY-MM-DD">
  </div>

  <div class="field">
    <label>首个角色（用于派生 id）</label>
    <input id="new_primary_char" name="primary_char" type="text" value="{{ default_primary_char }}"
           placeholder="strawberry / my_push / ..." list="char-list">
    <datalist id="char-list">
      {% for c in char_values %}
        <option value="{{ c }}">
      {% endfor %}
    </datalist>
  </div>

  <div class="field">
    <label>资产路径（绝对路径）</label>
    <input name="asset_path" type="text" required value="{{ default_asset }}" size="60"
           placeholder="例: F:\相册\偶活\拍立得扫描\偶活拍立得扫描\2026.07.18\img...png">
  </div>

  <div class="field">
    <label>其他标签（tags，使用逗号分隔，可省略）</label>
    <input name="tags" type="text" size="60"
           placeholder="例: shot:pair, event:shenshan_3rd_om_cd">
  </div>

  <div class="field">
    <label>备注（notes）</label>
    <textarea name="notes" rows="4" cols="60"></textarea>
  </div>

  {% if error %}
    <p class="err">{{ error }}</p>
  {% endif %}

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">创建</button>
    <a class="btn" href="/">取消</a>
  </div>

</form>

<script>
(function () {
  const idInput = document.querySelector('input[name=pid]');
  const shotInput = document.getElementById('new_shot_date');
  const charInput = document.getElementById('new_primary_char');

  function suggestId() {
    const shot = shotInput.value.trim();
    const ch = charInput.value.trim();
    let s = (shot || 'nostamp') + '_' + (ch || 'nochar') + '_';
    // 浏览器端生成 6 位十六进制随机后缀，用于区分记录
    const hex = Array.from({length: 3}, () => Math.floor(Math.random()*256).toString(16).padStart(2,'0')).join('');
    s += hex;
    idInput.value = s;
  }

  shotInput.addEventListener('change', suggestId);
  charInput.addEventListener('input', suggestId);
})();
</script>

{% endblock %}
