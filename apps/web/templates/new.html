{% extends "base.html" %}
{% block title %}Polarscan - 新建{% endblock %}
{% block body %}
<h2>新建拍立得</h2>
{% if error %}<p class="err">{{ error }}</p>{% endif %}

<form method="post" class="form-new">
  <fieldset>
    <legend>id（不可变，slug 形态）</legend>
    <input name="pid" type="text" required value="{{ default_pid }}"
           placeholder="例: shenshan_om_cd_2026-07-18_pair_001">
  </fieldset>

  <fieldset>
    <legend>第一个 asset 路径</legend>
    <input name="asset_path" type="text" required value="{{ default_asset }}" size="60"
           placeholder="例: 2026.07.18/img20260720_19253733.png  (相对 library_root 或绝对)">
  </fieldset>

  <fieldset>
    <legend>tags（逗号分隔，可后期补）</legend>
    <input name="tags" type="text" size="60"
           placeholder="例: event:shenshan_3rd_om_cd, char:strawberry, char:hime, shot:pair">
  </fieldset>

  <fieldset>
    <legend>shot_date (YYYY-MM-DD, 可空)</legend>
    <input name="shot_date" type="text" placeholder="2026-01-01">
  </fieldset>

  <fieldset>
    <legend>notes</legend>
    <textarea name="notes" rows="4" cols="60"></textarea>
  </fieldset>

  <div class="actions">
    <button type="submit">创建</button>
    <a href="/"><button type="button" class="cancel">取消</button></a>
  </div>
</form>

<p><a href="/">← 返回</a></p>
{% endblock %}
