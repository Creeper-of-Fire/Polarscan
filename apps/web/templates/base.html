<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Polarscan{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header>
  <a class="brand" href="/">Polarscan</a>
  <nav>
    <a href="/list">浏览</a>
    <a href="/new">新建</a>
    <a href="/pool/char">角色池</a>
    <a href="/pool/event">事件池</a>
    <a href="/pool/theme">主题池</a>
    <a href="/pool/collection">系列池</a>

  <form method="post" action="/reload" class="reload-form">
    <button type="submit" class="reload-btn">从磁盘重载</button>

</header>

<main>
{% block body %}{% endblock %}
</main>

</body>
</html>
