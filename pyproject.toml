[project]
name = "polarscan"
version = "0.0.1"
description = "拍立得元数据管理：标签驱动索引与轻量网页应用"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    # 当前全仓库无 import 引用——原用途是 server.py 反代 Vite dev server，该路径已退役。
    # 保留属可能性储备，不是既成依赖：
    #   - 冷层若从本地 F 盘迁到 HTTP 端点（WebDAV / 网盘，见 cold-data-gateway 演进约束），
    #     冷盘接触必须收束在 cold.py 的 4 个函数里，流式读取正好落在这里；
    #   - FastAPI 的 TestClient 底层也是 httpx。
    # 真到用不上时，把这一行连同上面这段注释一起删即可。
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["polarscan*", "apps*"]
