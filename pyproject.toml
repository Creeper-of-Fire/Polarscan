[project]
name = "polarscan"
version = "0.0.1"
description = "拍立得元数据管理：标签驱动索引与轻量网页应用"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["polarscan*", "apps*"]
